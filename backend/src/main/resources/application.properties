spring.application.name=careerpilot-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careerpilot}
spring.datasource.username=${DB_USERNAME:careerpilot}
spring.datasource.password=${DB_PASSWORD:careerpilot}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

careerpilot.ai.openai.api-key=${OPENAI_API_KEY:}
careerpilot.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
careerpilot.ai.openai.model=${OPENAI_MODEL:gpt-5.6}
