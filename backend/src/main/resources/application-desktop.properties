server.address=127.0.0.1
server.port=${CAREERPILOT_DESKTOP_PORT:47823}
server.shutdown=graceful

spring.lifecycle.timeout-per-shutdown-phase=15s

spring.datasource.url=${CAREERPILOT_DESKTOP_DB_URL:jdbc:h2:file:${user.home}/.careerpilot/data/careerpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

spring.h2.console.enabled=false

logging.file.name=${CAREERPILOT_DESKTOP_LOG_FILE:${user.home}/.careerpilot/logs/careerpilot.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=3

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

careerpilot.data-transfer.import-enabled=true
