map $http_x_forwarded_proto $careerpilot_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

map $http_x_forwarded_host $careerpilot_forwarded_host {
    "" $host;
    default $http_x_forwarded_host;
}
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $careerpilot_forwarded_host;
        proxy_set_header X-Forwarded-Proto $careerpilot_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
